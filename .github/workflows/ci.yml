name: Test and Security

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run services with Docker Compose
        run: docker compose --env-file .env.ci up --build -d

      - name: Run Tests (Pytest) inside container
        run: docker compose exec -T web pytest --disable-warnings

      - name: Down docker-compose
        if: always()
        run: docker compose down
  
  sca-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run Snyk to check for vulnerabilities
        run: |
          npm install -g snyk snyk-to-html
          pip install -r ./web/requirements.txt
          snyk test --json --command=python3 --file=./web/requirements.txt --package-manager=pip > report.json
          cat report.json| snyk-to-html -o snyk_report.html
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sca-report
          path: snyk_report.html
          retention-days: 3
        
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sca-report-json
          path: report.json
          retention-days: 3

  sast-check:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: '3.12'
            cache: 'pip'
        
        - name: Install and run SAST scanner (Bandit)
          run: |
            python -m pip install --upgrade pip
            pip install bandit==1.9.4
            bandit -r . --severity-level medium --format html -o bandit_report.html
        
        - name: Upload Build Artifact
          uses: actions/upload-artifact@v7
          with:
            name: sast-report
            path: bandit_report.html
            retention-days: 3
